<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers - Box Model</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- max-w-sm: largura maxima  -->
    <!-- mx-auto: margin no eixo x automatica (centraliza) -->
    <!-- mt-10: margin-top em 40 pixels -->
    <!-- p-3: padding -->
    <!-- border: borda -->
    <!-- rounded: bordas arredondadas -->
    <!-- shadow: sombra -->
    <div class="max-w-sm mx-auto mt-10 p-4 border border-gray-300 rounded-xl shadow-lg">

        <!-- w-full: sempre 100% de largura (deixa as img responsivas) -->
        <!-- h-48: altura maxima de 192px -->
        <!-- mb-4: margin-bottom -->
        <img class="w-full h-48 mb-4" src="./images/shoe-nike-air.png" alt="Tenis nike air branco">

        <h2 class="text-2xl font-semibold mb-1">Tenis nike air branco</h2>

        <p class="text-gray-600 font-medium mb-4">Feito para dominar as quadras</p>

        <!-- block: vira um elemento de bloco respeitando altura e largura dele -->
        <!-- p-4: padding -->
        <a href="" class="block bg-indigo-900 text-white text-center p-4 rounded-md font-bold text-2xl">Comprar agora</a>
    </div>
</html>
